# Filename: .github/workflows/validate.yml
# Timestamp: 2026-08-28 11:34 Europe/Vienna
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # The HACS action checks the repository license on the default branch.
          # During this initial feature branch the LICENSE file is not on main yet.
          # HACS will validate it normally after merge.
          ignore: images description topics license
